<html lang="vi" translate="no">

<body>
<canvas id="game"></canvas>
<div id="rotate">

    <rect x="45" y="24" width="30" height="66" rx="4" fill="#bfe6f0"/>

<script>
'use strict';
// ---- Built to be checked (the starter's hooks: fixed step, clock, window.game, play, figures) ----
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.heroSpeed is CONFIG.heroSpeed.value
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = 'Nunito, sans-serif';
const TITLE = 'Dải Đất Anh Hùng: Trần Quốc Toản';
const CONTROLS = ['◀ ▶ / ← →: đi · move', 'J / Space: đánh · attack', 'K (giữ · hold): đỡ · defend', 'L: VI/EN · P: pause · M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Language: VI default, EN switch, remembered on this device only (plan review 4) ----
let lang = 'vi';
try { const l = params.get('lang') || localStorage.getItem('tqt.lang'); if (l === 'vi' || l === 'en') lang = l; } catch (e) { /* storage blocked: stay VI */ }
const STRESS = params.get('stress') === '1'; // shots: add the stacked-diacritic string to buttons
const S = k => STRINGS[lang][k] + (STRESS && BTN_KEYS.has(k) && lang === 'vi' ? ' Ặ Ỗ Ữ ẫ ợ' : '');
const BTN_KEYS = new Set(['start', 'next', 'go', 'resume', 'home', 'toMap', 'replay']);
const L = o => o[lang]; // a {vi, en} content line
function setLang(l) {
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem('tqt.lang', l); } catch (e) { /* fine: not remembered */ }
  document.getElementById('rotate-text').textContent = STRINGS[l].turn;
  events.push({ type: 'lang', lang: l });
}
setLang(lang);

// ---- Screen ----
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;
// Safe areas (notch, home-indicator swipe zone): the canvas fits inside innerWidth/innerHeight minus
// env(safe-area-inset-*), read through the --sa* CSS vars. ?inset=top,right,bottom,left (CSS px)
// simulates a phone's insets for a desktop screenshot; players never see it.
const SIM_INSET = (params.get('inset') || '').split(',').map(Number);
function insets() {
  if (SIM_INSET.length === 4 && SIM_INSET.every(n => n >= 0)) return { t: SIM_INSET[0], r: SIM_INSET[1], b: SIM_INSET[2], l: SIM_INSET[3] };
  const cs = getComputedStyle(document.documentElement), v = n => parseFloat(cs.getPropertyValue(n)) || 0;
  const fsB = document.fullscreenElement ? CONFIG.fsGestureInset.value : 0; // fullscreen has no inset; Android's swipe-up zone is still there (QC O5)
  return { t: v('--sat'), r: v('--sar'), b: Math.max(v('--sab'), fsB), l: v('--sal') };
}
function fit() {
  const ins = insets(), aw = Math.max(1, innerWidth - ins.l - ins.r), ah = Math.max(1, innerHeight - ins.t - ins.b);
  const k = Math.min(aw / W, ah / H);
  viewScale = k;
  const r = k * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.left = Math.floor(ins.l + (aw - W * k) / 2) + 'px';
  canvas.style.top = Math.floor(ins.t + (ah - H * k) / 2) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  if (SIM_INSET.length === 4) { // show the simulated unsafe band in the shot
    let d = document.getElementById('inset-sim');
    if (!d) { d = document.createElement('div'); d.id = 'inset-sim'; document.body.appendChild(d); }
    d.style.cssText = `position:fixed;left:0;right:0;bottom:0;height:${ins.b}px;background:repeating-linear-gradient(45deg,rgba(255,60,60,.55) 0 6px,transparent 6px 12px);pointer-events:none`;
  }
}
addEventListener('resize', fit); addEventListener('orientationchange', fit); fit();
const portrait = () => innerHeight > innerWidth;

// ---- Drawing helpers ----
const C = { // palette: warm primaries to touch and reward, natural greens and river blues behind
  red: '#d9342b', gold: '#f2b632', goldDark: '#c98a12', cream: '#fff6e3', ink: '#3a2a1f',
  skin: '#f5c9a0', hair: '#231a16', indigo: '#2b4c8c', leaf: '#6cbf4f', leafDark: '#3f8a3a',
  river: '#5ab4d6', earth: '#c99a5b', earthDark: '#a87a45', enemy: '#6b5b95', enemyDark: '#4b3f6e',
  steel: '#8d93a8', teal: '#3e6b6b', glow: '#ffe24a', panel: 'rgba(42,36,64,0.86)',
};
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function font(size, weight = 800) { return `${weight} ${size}px ${FONT}`; }
function text(s, x, y, size, c, align = 'center', weight = 800) {
  ctx.fillStyle = c; ctx.font = font(size, weight); ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, weight = 800) {
  ctx.font = font(size, weight);
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Fit text in a box: shrink until the wrapped lines fit maxLines (EN runs longer).
function textBox(s, x, y, maxW, size, c, maxLines = 2, lh = 1.25, weight = 800) {
  let sz = size, lines = wrap(s, maxW, sz, weight);
  while (lines.length > maxLines && sz > 18) { sz -= 2; lines = wrap(s, maxW, sz, weight); }
  const top = y - (lines.length - 1) * sz * lh / 2;
  lines.forEach((ln, i) => text(ln, x, top + i * sz * lh, sz, c, 'center', weight));
  return sz;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circle(x, y, r, fill, stroke, lw = 4) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function star(x, y, r, fill, stroke, rot = 0) { // drawn 5-point star (rewards, bursts): never a font symbol
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(2, r * 0.12); ctx.lineJoin = 'round'; ctx.stroke(); }
}
// Bronze-drum ring motif: concentric rings around a star with rays (the Vietnamese accent).
function drumMotif(x, y, r, col, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  circle(x, y, r, null, col, Math.max(2, r * 0.06));
  circle(x, y, r * 0.72, null, col, Math.max(1.5, r * 0.04));
  for (let i = 0; i < 14; i++) { // little herons/notches in the ring band, as dashes
    const a = i * Math.PI * 2 / 14; ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.78, y + Math.sin(a) * r * 0.78);
    ctx.lineTo(x + Math.cos(a) * r * 0.94, y + Math.sin(a) * r * 0.94);
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, r * 0.05); ctx.stroke();
  }
  star(x, y, r * 0.5, col, null);
  ctx.restore();
}

// ---- Input: keys + touch, mapped to actions ----
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const KEYMAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  attack: ['KeyJ', 'Space'], defend: ['KeyK', 'ShiftLeft', 'ShiftRight'],
  confirm: ['Enter', 'NumpadEnter'],
};
const touchHold = new Map(); // pointerId -> action
const touchTap = new Set();  // actions tapped this step
const held = a => KEYMAP[a].some(c => down.has(c)) || [...touchHold.values()].includes(a);
const tapped = a => KEYMAP[a].some(c => hit.has(c)) || touchTap.has(a);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
const releaseAll = () => { down.clear(); touchHold.clear(); };
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); }); // more reliable than blur on phones

let ui = []; // buttons drawn this frame: {x,y,w,h, onTap} or {cx,cy,r, action}
function toLogical(e) {
  const b = canvas.getBoundingClientRect();
  return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
}
function uiAt(p) {
  for (let i = ui.length - 1; i >= 0; i--) {
    const u = ui[i];
    if (u.r ? Math.hypot(p.x - u.cx, p.y - u.cy) <= u.r * 1.15 : p.x >= u.x && p.x <= u.x + u.w && p.y >= u.y && p.y <= u.y + u.h) return u;
  }
  return null;
}
let wantFs = false; // set on the touch's start: the Start tap changes the scene before the finger lifts (QC B4)
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (scene === 'title' && !document.fullscreenElement) wantFs = true; // audio starts on the touch's end (gesture()), never here: Chrome refuses it on pointerdown
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
  const u = uiAt(toLogical(e)); if (!u) return;
  if (u.action) { touchHold.set(e.pointerId, u.action); touchTap.add(u.action); }
  else if (u.onTap) pendingTaps.push(u.onTap);
});
canvas.addEventListener('pointermove', e => { // a thumb sliding between ◀ and ▶ switches direction
  const a = touchHold.get(e.pointerId); if (a !== 'left' && a !== 'right') return;
  const u = uiAt(toLogical(e)); if (u && (u.action === 'left' || u.action === 'right')) touchHold.set(e.pointerId, u.action);
});
const lift = e => touchHold.delete(e.pointerId);
// Chrome and iOS Safari only count a touch's END as a user gesture: start or resume audio there
// too (android QC B3), and ask for fullscreen + landscape lock on the title screen (QC O1). iOS
// Safari has no fullscreen for pages: the request is skipped and the pads keep their minimum size.
function gesture(e) {
  startAudio();
  const real = e && e.isTrusted && (!navigator.userActivation || navigator.userActivation.isActive);
  const go = wantFs; wantFs = false;
  if (real && go && !document.fullscreenElement) {
    const el = document.documentElement;
    try {
      const pr = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
      if (pr && pr.then) pr.then(() => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* no lock */ } }).catch(() => {});
    } catch (e) { /* refused: play in the browser window */ }
  }
}
canvas.addEventListener('pointerup', gesture);
canvas.addEventListener('touchend', gesture, { passive: true });
addEventListener('keydown', e => { if ((e.code === 'Enter' || e.code === 'Space') && scene === 'title') wantFs = true; if (e.code === 'Enter' || e.code === 'Space') gesture(e); });
addEventListener('fullscreenchange', fit);
canvas.addEventListener('pointerup', lift); canvas.addEventListener('pointercancel', lift);
canvas.addEventListener('lostpointercapture', lift); // a lost capture never leaves an action held
canvas.addEventListener('contextmenu', e => e.preventDefault());
let pendingTaps = [];

// UI button: rounded, warm, thumb-sized. Draws and registers itself.
function button(label, x, y, w, h, onTap, opts = {}) {
  const pulse = opts.pulse ? 1 + Math.sin(state.t * 6) * 0.04 : 1;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(pulse, pulse);
  rr(-w / 2, -h / 2 + 6, w, h, h / 2.6); ctx.fillStyle = opts.shade || C.goldDark; ctx.fill();
  rr(-w / 2, -h / 2, w, h, h / 2.6); ctx.fillStyle = opts.fill || C.gold; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
  textBox(label, x + w / 2, y + h / 2, w - 30, opts.size || 34, opts.ink || C.ink, 1);
  ui.push({ x, y, w, h, onTap });
}
function langButton() { // top right on every screen
  const x = 1100, y = 18, w = 160, h = 96;
  rr(x, y, w, h, 30); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = C.gold; ctx.stroke();
  text('VI', x + 44, y + h / 2, 32, lang === 'vi' ? C.red : '#9a8f86');
  text('|', x + 80, y + h / 2, 30, '#9a8f86');
  text('EN', x + 116, y + h / 2, 32, lang === 'en' ? C.red : '#9a8f86');
  ui.push({ x, y, w, h, onTap: () => setLang(lang === 'vi' ? 'en' : 'vi') });
}
function roundIcon(x, y, r, draw, onTap) {
  circle(x, y, r, 'rgba(255,255,255,0.85)', C.gold, 4); draw(x, y, r);
  ui.push({ x: x - r, y: y - r, w: 2 * r, h: 2 * r, onTap });
}
function pauseIcon(x, y, r) { ctx.fillStyle = C.ink; rr(x - r * 0.35, y - r * 0.4, r * 0.24, r * 0.8, 4); ctx.fill(); rr(x + r * 0.11, y - r * 0.4, r * 0.24, r * 0.8, 4); ctx.fill(); }
function speakerIcon(x, y, r) {
  ctx.fillStyle = C.ink; ctx.beginPath();
  ctx.moveTo(x - r * 0.45, y - r * 0.18); ctx.lineTo(x - r * 0.2, y - r * 0.18); ctx.lineTo(x + r * 0.12, y - r * 0.45);
  ctx.lineTo(x + r * 0.12, y + r * 0.45); ctx.lineTo(x - r * 0.2, y + r * 0.18); ctx.lineTo(x - r * 0.45, y + r * 0.18); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round';
  if (muted) { ctx.beginPath(); ctx.moveTo(x + r * 0.25, y - r * 0.22); ctx.lineTo(x + r * 0.55, y + r * 0.22); ctx.moveTo(x + r * 0.55, y - r * 0.22); ctx.lineTo(x + r * 0.25, y + r * 0.22); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(x + r * 0.15, y, r * 0.3, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(x + r * 0.15, y, r * 0.5, -0.8, 0.8); ctx.stroke(); }
}

// ---- Audio: Web Audio tones, started on first input, mute on M ----
let audio = null, muted = false;
function startAudio() {
  try {
    if (!audio) {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    }
    if (audio.ac.state === 'suspended') { const pr = audio.ac.resume(); if (pr && pr.catch) pr.catch(() => {}); }
  } catch (e) { /* no audio: play on silently */ }
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  drum() { tone(110, 0.25, 'sine', 0.6, 0.5); tone(220, 0.08, 'triangle', 0.2); },
  clang() { tone(880, 0.18, 'triangle', 0.25); tone(1320, 0.12, 'sine', 0.15); },
  swoosh() { tone(500, 0.12, 'sawtooth', 0.05, 0.4); },
  bonk() { tone(180, 0.2, 'triangle', 0.25, 0.7); },
  chime() { tone(784, 0.2, 'sine', 0.3); setTimeout(() => tone(1046, 0.3, 'sine', 0.3), 0); },
  soft() { tone(260, 0.25, 'triangle', 0.18, 0.85); },
  tap() { if (audio && audio.ac.currentTime - (sfx.lastTap || -1) < 0.08) return; if (audio) sfx.lastTap = audio.ac.currentTime; tone(660, 0.06, 'sine', 0.15); }, // once per press (QC O6)
};

// ---- Figures: every one drawn in code (no emoji, no plain circles) ----
// Hero: rounded young hero, black topknot, red headband, red tunic with gold trim, staff, rattan shield.
function drawHero(x, y, face, pose, t, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(face * s, s);
  ellipse(0, 4, 60, 12, 'rgba(0,0,0,0.18)');
  const walk = pose.walk ? Math.sin(t * 14) : 0, bob = pose.walk ? Math.abs(Math.sin(t * 14)) * 4 : 0;
  ctx.translate(0, -bob);
  const def = pose.defend;
  // shield on the back when not defending
  if (!def) { ellipse(-30, -118, 14, 40, C.goldDark); }
  // legs
  ctx.fillStyle = C.indigo;
  rr(-24 + walk * 8, -70, 20, 68, 8); ctx.fill(); rr(4 - walk * 8, -70, 20, 68, 8); ctx.fill();
  ctx.fillStyle = C.ink; rr(-28 + walk * 8, -10, 28, 12, 6); ctx.fill(); rr(0 - walk * 8, -10, 28, 12, 6); ctx.fill();
  // tunic
  ctx.fillStyle = C.red; ctx.beginPath();
  ctx.moveTo(-34, -150); ctx.lineTo(34, -150); ctx.lineTo(42, -62); ctx.quadraticCurveTo(0, -52, -42, -62); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.gold; rr(-38, -96, 76, 12, 6); ctx.fill();               // belt
  ctx.beginPath(); ctx.moveTo(-14, -150); ctx.lineTo(0, -126); ctx.lineTo(14, -150); ctx.closePath(); ctx.fill(); // collar
  // staff (attack) arm
  const swing = pose.attack != null ? pose.attack : -1; // 0..1 through the swing
  const ang = swing >= 0 ? -1.9 + swing * 2.6 : (def ? 0.9 : -0.6);
  ctx.save(); ctx.translate(18, -128); ctx.rotate(ang);
  ctx.fillStyle = '#8a5a2b'; rr(-6, -150, 12, 190, 6); ctx.fill();
  ctx.fillStyle = C.gold; rr(-8, -158, 16, 18, 6); ctx.fill();
  ctx.fillStyle = C.skin; circle(0, 0, 12, C.skin);
  ctx.restore();
  if (swing >= 0.2 && swing <= 0.85) { // swoosh arc
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(18, -128, 150, -1.9 + 0.3, -1.9 + swing * 2.6 - 1.4 + 1.1); ctx.stroke();
  }
  // head
  circle(0, -196, 44, C.skin);
  ctx.fillStyle = C.hair; ctx.beginPath(); ctx.arc(-2, -200, 46, Math.PI * 1.02, Math.PI * 2.02); ctx.fill();
  circle(-14, -246, 15, C.hair);                                              // topknot
  ctx.fillStyle = C.red; rr(-46, -214, 92, 12, 6); ctx.fill();               // headband
  const flap = Math.sin(t * 9) * 6;
  ctx.beginPath(); ctx.moveTo(-44, -210); ctx.quadraticCurveTo(-70, -206 + flap, -84, -192 + flap); ctx.lineTo(-78, -186 + flap); ctx.quadraticCurveTo(-64, -198, -44, -200); ctx.fill();
  // face (looks the way he faces)
  circle(14, -190, 6, C.ink); circle(32, -190, 6, C.ink); circle(16, -192, 2, '#fff'); circle(34, -192, 2, '#fff');
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round';

const GROUND = 470;          // the path's line (feet); thumb pads sit below it

function drawBackground(camX, theme, t) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);

  circle(sx, 190, 54, 'rgba(255,207,90,0.8)'); drumMotif(sx, 190, 46, 'rgba(201,138,18,0.4)');
  // far karst mountains
  ctx.fillStyle = '#a9cfc3';
  for (let i = -1; i < 8; i++) {
    const bx = i * 260 - (camX * 0.15) % 260;
    ctx.beginPath(); ctx.moveTo(bx - 40, GROUND - 60); ctx.quadraticCurveTo(bx + 20, GROUND - 330 - (i % 3) * 30, bx + 90, GROUND - 260 + (i % 2) * 40);

    else if (theme === 'bamboo') ICONS.bamboo(bx + 50, GROUND - 120, 90);

    else { // areca palm

  // padlock opening (drawn)
  ctx.save(); ctx.translate(980, 300); ctx.globalAlpha = 1 - open * 0.85;
  ctx.strokeStyle = C.steel; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(0, -30 - open * 40, 34, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = C.steel; rr(-50, -30, 100, 80, 14); ctx.fill(); circle(0, 4, 10, '#3e3856'); ctx.restore();
  if (open >= 1) { for (let k = 0; k < 6; k++) { const a = t * 2 + k * 1.05; star(980 + Math.cos(a) * 150, 300 + Math.sin(a) * 120, 18, C.glow, C.goldDark, a); } text('?', 980, 300, 110, C.goldDark); }
  text(L(CONTENT.nextHero), 980, 450, 30, '#fff');
  text(S('unlocked'), W / 2, 100, 52, C.gold);
  text(S('mapStub'), W / 2, 530, 26, 'rgba(255,255,255,0.6)', 'center', 600);
  button(S('replay'), 260, 580, 340, 110, () => { reset(); scene = 'intro'; }, { fill: C.cream, shade: '#c8b89a' });
  button(S('toMap'), 680, 580, 340, 110, () => { reset(); scene = 'title'; }, { pulse: true });
  langButton();
}

// ---- Title ----
function drawTitle() {
  ui = []; drawBackground(0, 'village', state.t);
  rr(150, 60, 980, 210, 40); ctx.fillStyle = C.panel; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.gold; ctx.stroke();
  drumMotif(240, 165, 70, 'rgba(242,182,50,0.8)'); drumMotif(1040, 165, 70, 'rgba(242,182,50,0.8)');
  text(S('title'), W / 2, 140, 76, C.gold);
  text(S('subtitle'), W / 2, 220, 36, '#fff');
  drawHero(260, GROUND, 1, { walk: false }, state.t, 0.8);
  button(S('start'), W / 2 - 190, 330, 380, 130, startIntro, { pulse: true, size: 44 });
  rr(150, 520, 980, 150, 24); ctx.fillStyle = 'rgba(255,246,227,0.92)'; ctx.fill();
  // controls legend (drawn icons) + keys
  const items = [[arrowPair, S('move')], [staffIcon, S('attack')], [shieldIcon, S('defend')]];
  items.forEach(([ic, lab], i) => { const x = 300 + i * 340; ctx.save(); ctx.translate(x - 60, 575); circle(0, 0, 38, '#fff', C.gold, 4); ic({ r: 38 }); ctx.restore(); text(lab, x + 20, 575, 32, C.ink, 'left'); });
  text(S('keys'), W / 2, 640, 24, '#6a5a4a', 'center', 700);
  langButton();
}
function arrowPair(a) { ctx.save(); ctx.translate(-12, 0); arrowIcon({ r: a.r * 0.7 }, -1); ctx.translate(24, 0); arrowIcon({ r: a.r * 0.7 }, 1); ctx.restore(); }
function startIntro() { sfx.tap(); reset(); scene = 'intro'; events.push({ type: 'start' }); }

// ---- Scenes ----
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ui = []; drawBackground(0, 'village', state.t);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, 0, W, H);
      const t = state.t, y = 560;
      ctx.save(); ctx.translate(0, y - GROUND);
      drawHero(170, GROUND, 1, { walk: false, defend: false }, t, 1);
      drawEnemy({ x: 470, kind: 'spear', face: -1, state: 'approach', id: 1 }, t);
      drawEnemy({ x: 780, kind: 'shield', face: -1, state: 'windup', id: 2 }, t);
      drawEnemy({ x: 1100, kind: 'leader', face: -1, state: 'approach', id: 3 }, t);
      ctx.restore();
      [[170, 'heroLabel'], [470, 'spear'], [780, 'shield'], [1100, 'leader']].forEach(([x, k]) => text(S(k), x, 650, 26, C.ink));
      langButton();
    },
  },
  title: { update(dt) { state.t += dt; if (tapped('confirm') || pressed('Space')) startIntro(); }, draw: drawTitle },
  intro: storyScene('intro'),
  play: {
    update(dt) { if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; } updatePlay(dt); },
    draw: drawPlay,
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || tapped('confirm')) scene = 'play'; },
    draw() {
      drawPlay(); ui = [];
      ctx.fillStyle = 'rgba(42,36,64,0.7)'; ctx.fillRect(0, 0, W, H);
      text(S('pause'), W / 2, 200, 64, '#fff');
      button(S('resume'), W / 2 - 200, 290, 400, 120, () => { scene = 'play'; }, { pulse: true });
      button(S('home'), W / 2 - 200, 450, 400, 110, () => { reset(); scene = 'title'; }, { fill: C.cream, shade: '#c8b89a' });
      langButton();
    },
  },
  ending: storyScene('ending'),
  quiz: { update: updateQuiz, draw: drawQuiz },
  results: { update(dt) { state.t += dt; if (tapped('confirm')) { scene = 'unlock'; state.t = 0; events.push({ type: 'unlock' }); } }, draw: drawResults },
  unlock: { update(dt) { state.t += dt; if (tapped('confirm')) { reset(); scene = 'title'; } else if (pressed('KeyR')) { reset(); scene = 'intro'; } }, draw: drawUnlock },
};

// ---- Loop ----
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (pressed('KeyL')) setLang(lang === 'vi' ? 'en' : 'vi');
  const taps = pendingTaps; pendingTaps = [];
  for (const f of taps) { sfx.tap(); f(); }
  if (!portrait()) scenes[scene].update(STEP);
  hit.clear(); touchTap.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

// ---- Start: ?scene= opens a screen directly, for screenshots (players never see it) ----
reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
if (scene === 'quiz') { startQuiz(); state.quiz.i = Math.min(Number(params.get('q') || 1) - 1, state.quiz.qs.length - 1); if (params.get('wrong')) { answer(Number(params.get('wrong')) - 1); state.quiz.shakeT = 0; } }
if (scene === 'results') state.stars = Number(params.get('stars') || 2);
if (scene === 'unlock') state.t = Number(params.get('ut') || 0);
if (scene === 'play' && params.get('beat')) { // ?beat=N: start at beat N's fight; &stage=telegraph: an enemy mid-telegraph
  const i = Math.max(0, Math.min(beats().length - 1, Number(params.get('beat')) - 1));
  state.beat = i; state.tut = { moved: true, hit: true, blocked: true, windupSeen: true, enemySeen: true };
  state.hero.x = beatX(i) + 10; startBeat(i);
  if (params.get('stage') === 'telegraph') {
    state.tut.blocked = false; state.queue = state.queue.slice(1);
    state.enemies.push({ id: 99, kind: beats()[i].enemies[0], x: state.hero.x + tune.enemyReach, face: -1, state: 'windup', t: 0, hits: 0, kb: 0, moving: false });
    state.spawnT = 99;
  }
  if (params.get('stage') === 'caption') { state.queue = []; state.phase = 'caption'; }
}
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions: []

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: core_platform_imports
    status: active
    description: "KidCore and MorphCore import anything other than the Swift standard library and Foundation"
    why: "the cores stay UI-free and portable (ADR-0001, ADR-0002 D1-D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: platform_types_outside_app_layer
    status: active
    description: "UIKit, AppKit, SwiftUI, SpriteKit, AVFoundation or CoreGraphics types outside apple/<App>, its tests, or apple/Tools"
    why: "platform code stays at the edge (ADR-0002 D1)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: core_foundation_time_and_ids
    status: active
    description: "Date, Calendar, Decimal, Duration, DispatchTime or UUID in the cores"
    why: "Kotlin mapping and cross-platform fixtures (ADR-0002 D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: core_json_coding
    status: active
    description: "JSONDecoder, JSONEncoder or JSON Codable conformances in the cores"
    why: "JSON is decoded at the edge; the cores take plain models (ADR-0002 D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: core_character_and_narrow_numbers
    status: active
    description: "Character, Float, CGFloat, Int32 or Int8 in the cores; UInt64 outside RandomSource, the MorphCore contract types and the morph-seed derivation; iterating or counting a String directly instead of via unicodeScalars/utf8 helpers"
    why: "Kotlin mapping and cross-platform fixtures (ADR-0002 D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: locale_case_mapping
    status: active
    description: "uppercased(with:), localizedUppercase or Unicode-aware upper/lower-casing in the cores; use the ASCII-only helper"
    why: "Kotlin mapping and cross-platform fixtures (ADR-0002 D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: unpinned_rounding
    status: active
    description: "round, lround, rint or .rounded() outside roundHalfAwayFromZero in the cores"
    why: "Kotlin's round is half-even; one helper keeps both platforms equal (ADR-0002 D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: set_dictionary_order_dependence
    status: active
    description: "any output that depends on Set or Dictionary iteration order"
    why: "iteration order differs across platforms and runs (ADR-0002 D2)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: unnamed_clock_read
    status: active
    description: "a module reading a clock it does not name, or the app computing the play clock"
    why: "the freeze and away rules depend on each module using its own clock (ADR-0002 D3)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
  - pattern: shared_random_generator
    status: active
    description: "one random generator shared by several streams"
    why: "one stream's draws must never shift another's (ADR-0002 D4)"
    adr: docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18


# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: "superseded_by: ADR-NNNN" instead,
#     quoted: unquoted, the second colon makes the file invalid YAML.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="superseded_by: ADR-"
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts with its section's name key ("- state:", "- contract:", "- system:"
#   or "- target_fps:" for the frame budget, "- purpose:", "- pattern:"), the
#   dash at column 2 (or 0, the same for every entry of a section); its fields
#   sit two columns past the dash. Quote a value that holds ": ", such as
#   "superseded_by: ADR-NNNN". A line in any other shape is reported as
#   unsupported layout, with its number.

version: 1
last_updated: "2026-11-18"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: play_clock
    status: active
    owner_system: reveal-stage
    adr: docs/architecture/adr-0002-modules-seams-types.md
    interface: "PlayClock = uptime - frozenTotal, derived in KidCore (Reveal Stage R8); read-only to every other system"
    write_access: reveal-stage-only
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - state: childLockActive
    status: active
    owner_system: settings-store
    adr: docs/architecture/adr-0002-modules-seams-types.md
    interface: "run value of the stored childLock (Settings Store); read by Child Lock-in, App Shell, Parent Gate"
    write_access: settings-store-only
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - state: kioskModeOn
    status: active
    owner_system: child-lock-in
    adr: docs/architecture/adr-0002-modules-seams-types.md
    interface: "set by Child Lock-in on entering Waiting, cleared on Off (including Off after the engage timeout, Child Lock-in R7); read by Input's cmd exception (Input R5), Child Lock-in, and the Parent Gate panel, which shows Quit while it is on (G7)"
    write_access: child-lock-in-only
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | "superseded_by: ADR-NNNN"
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: clocks
    status: active
    pattern: direct_call
    producer: app (adapters)
    consumers:
      - kidcore
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "UptimeClock.now() -> Double; AwayClock.now() -> Double; WallClock.now() -> {minutesOfDay: Double, dayKey: Int}; PlayClock derived in KidCore"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - contract: random_source
    status: active
    pattern: direct_call
    producer: app (one seeded generator per stream)
    consumers:
      - key-table-theme-data
      - hint-letters
      - onscreen-keyboard-row
      - morphcore
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "RandomSource.next() -> UInt64; u = Double(x >> 11) * 2^-53; one source per stream"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - contract: normalized_events
    status: active
    pattern: direct_call
    producer: app (input adapters)
    consumers:
      - input-key-filter
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "KeyEvent {character: String?, positionKey: String?, modifiers: Int bitmask, isRepeat, physicalId: String, kind: down|up|cancel|modifiersChanged, time}; TouchEvent {pointerId, phase, xPx, yPx, time}"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - contract: frame_tick
    status: active
    pattern: direct_call
    producer: app (display link / Choreographer)
    consumers:
      - reveal-stage
      - press-queue
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "tick(now:) on the uptime clock, once per frame before drawing"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - contract: platform_seams
    status: active
    pattern: direct_call
    producer: kidcore (protocols)
    consumers:
      - app
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "SettingsBackend, KioskEffects, AudioOutput, RenderSink, ResidencySink, ThemeSource, DisplayMetrics, AccessibilityState, AppLifecycle, DebugLog, KeyStateQuery (optional: anyNonModifierDown(except:))"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - contract: freeze_settle_chain
    status: active
    pattern: direct_call
    producer: parent-gate-panel
    consumers:
      - reveal-stage
      - press-queue
      - hint-letters
      - parade
      - audio-voice
      - scene-time-weather
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "Parent Gate -> RevealStage.freeze()/resume()/settle() -> Press Queue, Hint Letters (challenge), Parade, Audio plan, Scene motion"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""
  - contract: kiosk_mode_chain
    status: active
    pattern: direct_call
    producer: settings-store
    consumers:
      - child-lock-in
      - app-shell-title
      - input-key-filter
      - parent-gate-panel
    adr: docs/architecture/adr-0002-modules-seams-types.md
    signal_signature: "settings read -> Child Lock-in Waiting sets kioskModeOn -> App Shell ready -> Child Lock-in R3 -> KioskEffects.apply(); kioskModeOn cleared on Off (incl. after the engage timeout); read by Input, Child Lock-in, Parent Gate G7"
    referenced_by:
      - docs/architecture/adr-0002-modules-seams-types.md
    added: 2026-11-18
    revised: ""


# TASK-007. Pinned versions. Runtime dependencies: Android SDK + kotlinx.serialization only (Luan, 2026-11-14).
[versions]
agp = "8.13.2"                 # AGP 8.x needs JDK 17; supports up to API 36
kotlin = "2.2.21"
kotlinxSerialization = "1.9.0" # built against Kotlin 2.2
junit = "4.13.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
